# Sobre mim
sobre.titulo=Sobre mim
sobre.eyebrow=Engenharia de Software · PUC Minas
sobre.paragrafo1=Sou estudante de Engenharia de Software e tenho experiência com Python, Java e Golang, além de desenvolvimento e manutenção de aplicações web.
sobre.paragrafo2=No curso, trabalho com desenvolvimento web (front-end e back-end), algoritmos e estruturas de dados, e gosto de transformar ideias em sistemas organizados, acessíveis e bem documentados. Já desenvolvi projetos completos, como o site de uma galeria de arte para uma ilustradora digital.
sobre.paragrafo3=Busco uma oportunidade de estágio em desenvolvimento de software, onde eu possa aprender com times experientes, contribuir com código de qualidade e crescer como engenheira.
