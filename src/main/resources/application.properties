spring.application.name=portfolio-profissional

# Porta: o Render informa a porta pela variável PORT
server.port=${PORT:8080}

# Compressão e cache de arquivos estáticos
server.compression.enabled=true
spring.web.resources.cache.cachecontrol.max-age=7d
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Textos (português é o padrão; inglês em messages_en.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Dados de contato (aparecem na página Contato)
portfolio.contato.email-destino=${EMAIL_DESTINO:carolina.amsouza0405@gmail.com}
portfolio.contato.whatsapp=5573999667676
portfolio.contato.whatsapp-exibicao=(73) 99966-7676
portfolio.contato.github=https://github.com/Carolinasouza456
portfolio.contato.linkedin=${LINKEDIN_URL:}

# Envio de e-mail pelo formulário (API do Resend)
# A chave NUNCA deve ficar no código: use a variável de ambiente RESEND_API_KEY
portfolio.email.resend-api-key=${RESEND_API_KEY:}
portfolio.email.remetente=${EMAIL_REMETENTE:Portfolio Carolina <onboarding@resend.dev>}

# Link do repositório do projeto da galeria Loputyn
portfolio.projetos.loputyn-repositorio=${REPOSITORIO_LOPUTYN:https://github.com/Carolinasouza456}
