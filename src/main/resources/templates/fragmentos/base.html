<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<!-- Cabeçalho do documento (head) compartilhado por todas as páginas -->
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · ' + #{site.nome}">Portfólio</title>
    <meta name="description" th:content="#{site.descricao}">
    <meta name="theme-color" content="#0d0b0e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0b0e'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-style='italic' font-size='36' text-anchor='middle' fill='%23d1ac8b'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <!-- Sem JavaScript, o conteúdo com animação de entrada continua visível -->
    <noscript><style>.aparecer { opacity: 1; transform: none; }</style></noscript>
</head>

<body>

<!-- Menu de navegação -->
<header class="topo" th:fragment="menu">
    <div class="conteudo topo__interno">
        <a class="logo" th:href="@{/}" th:text="#{site.nome}">Carolina Souza</a>

        <button class="menu-botao" type="button" aria-controls="menu-principal" aria-expanded="false"
                th:aria-label="#{nav.menu}">
            <span></span><span></span><span></span>
        </button>

        <nav class="menu" id="menu-principal">
            <a th:href="@{/}" th:classappend="${paginaAtiva == 'sobre'} ? 'ativo'" th:text="#{nav.sobre}">Sobre mim</a>
            <a th:href="@{/projetos}" th:classappend="${paginaAtiva == 'projetos'} ? 'ativo'" th:text="#{nav.projetos}">Projetos</a>
            <a th:href="@{/experiencias}" th:classappend="${paginaAtiva == 'experiencias'} ? 'ativo'" th:text="#{nav.experiencias}">Experiências</a>
            <a th:href="@{/contato}" th:classappend="${paginaAtiva == 'contato'} ? 'ativo'" th:text="#{nav.contato}">Contato</a>

            <div class="idiomas" role="group" th:aria-label="#{nav.idioma}">
                <a href="?lang=pt" lang="pt" th:classappend="${#locale.language == 'pt'} ? 'ativo'">PT</a>
                <a href="?lang=en" lang="en" th:classappend="${#locale.language == 'en'} ? 'ativo'">EN</a>
            </div>
        </nav>
    </div>
</header>

<!-- Rodapé -->
<footer class="rodape" th:fragment="rodape">
    <div class="conteudo">
        <div class="rodape__cartao">
            <p class="rodape__rotulo" th:text="#{rodape.responsavel}">Responsável pelo site</p>
            <dl class="rodape__dados">
                <dt th:text="#{rodape.nome}">Nome</dt>
                <dd th:text="#{site.nome.completo}">Carolina Almeida Mendes de Souza</dd>
                <dt th:text="#{rodape.curso}">Curso</dt>
                <dd th:text="#{rodape.curso.valor}">Engenharia de Software</dd>
                <dt th:text="#{rodape.turma}">Turma</dt>
                <dd th:text="#{rodape.turma.valor}">Manhã</dd>
            </dl>
        </div>
        <p class="rodape__aviso" th:text="#{rodape.aviso}">Site criado para fins acadêmicos</p>
    </div>
</footer>

<script th:fragment="scripts" th:src="@{/js/site.js}" defer></script>

</body>
</html>
